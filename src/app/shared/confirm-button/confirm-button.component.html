<div class="a-confirm-btn">
  <button mat-raised-button color="primary"
          aria-label="To delete, press this button and then confirm with the button on the left"
          (click)="armButton()"
          [disabled]="isArmed || disabled">
    <mat-icon>delete</mat-icon>
    DELETE
  </button>
  <button mat-raised-button color="warn"
          aria-label="confirm delete"
      [style.visibility]="!isArmed ? 'hidden' : 'visible'"
          (click)="fireButton()">
    <mat-icon>check_circle</mat-icon>
    CONFIRM
  </button>
</div>
